<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本機影片管理</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="admin.css"><header><strong>BEGRITZ SUBTITLE ARCHIVE</strong><a href="../" target="_blank">預覽網站 ↗</a><button id="export">匯出 GitHub 上傳檔案</button></header><main><aside><div class="list-heading"><h1>影片管理</h1><button id="new">＋ 新增</button></div><input id="search" placeholder="搜尋影片…" type="search"><div id="list"></div></aside><section><form id="editor"><h2 id="form-title">新增影片</h2><label>影片標題<input id="title" required></label><div class="columns"><label>YouTube 連結<input id="youtube" required placeholder="https://www.youtube.com/watch?v=…"></label><label>日期<input id="date" type="date" required></label></div><div class="columns"><label>類型<select id="type"><option value="live">直播</option><option value="space">SPACE</option><option value="cover">翻唱</option><option value="performance">表演</option><option value="other">其他</option></select></label><label>封面網址（留白使用 YouTube 縮圖）<input id="cover" placeholder="https://…"></label></div><fieldset><legend>成員</legend><label><input type="checkbox" name="member" value="BEGRITZ">全體</label><label><input type="checkbox" name="member" value="DOHA">도하 💜</label><label><input type="checkbox" name="member" value="CHAN">찬 🧡</label><label><input type="checkbox" name="member" value="LUBIN">루빈 🩵</label><label><input type="checkbox" name="member" value="SINI">신의 💚</label><label><input type="checkbox" name="member" value="TAEBUM">태범 🩶</label></fieldset><h3>字幕</h3><p>匯入 UTF-8 的 SRT；未選新檔時保留原字幕。兩種語言可以分開替換。</p><div class="columns"><label>繁體中文 SRT<input id="zh-file" type="file" accept=".srt"></label><label>韓文 SRT<input id="ko-file" type="file" accept=".srt"></label></div><div id="cue-summary"></div><details><summary>字幕預覽</summary><div id="cue-preview"></div></details><div class="actions"><button class="primary" type="submit">儲存影片</button><button type="button" id="delete">刪除影片</button></div><p id="status" role="status"></p></form></section></main><script src="../subtitle-core.js"></script><script src="admin.js"></script></html>
